name: Напоминание о новой таблице (1 числа)

on:
  schedule:
    # 1-го числа каждого месяца, 06:00 UTC = 09:00 МСК
    - cron: '0 6 1 * *'
  workflow_dispatch:   # ручной запуск для проверки

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить requests
        run: pip install requests

      - name: Отправить напоминание
        run: python monthly_reminder.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
