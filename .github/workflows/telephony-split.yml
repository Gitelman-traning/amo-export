name: Телефония по отделам (BMI × АТС)

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Месяцы через запятую, YYYY-MM (пусто = прошлый месяц)"
        required: false
      dry_run:
        description: "Только лог, на лист не писать"
        type: boolean
        default: false

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python telephony_split.py
        env:
          BMI_API_KEY: ${{ secrets.BMI_API_KEY }}
          ONLINEPBX_AUTH_KEY: ${{ secrets.ONLINEPBX_AUTH_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SERVICES_SPREADSHEET_ID: ${{ vars.SERVICES_SPREADSHEET_ID }}
          MONTHS: ${{ inputs.months }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
