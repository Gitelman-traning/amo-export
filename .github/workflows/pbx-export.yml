name: OnlinePBX → Google Sheets (звонки)

on:
  # Запуск приходит извне (cron-job.org → GitHub API), плюс ручной из UI.
  workflow_dispatch:
    inputs:
      spreadsheet_id:
        description: 'ID таблицы (пусто = текущая из переменной)'
        required: false
        default: ''
      date_to:
        description: 'Верхняя граница ДД.ММ.ГГГГ (пусто = вчера). Напр. 31.08.2026'
        required: false
        default: ''

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python pbx_export.py
        env:
          ONLINEPBX_AUTH_KEY: ${{ secrets.ONLINEPBX_AUTH_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ inputs.spreadsheet_id || vars.SPREADSHEET_ID }}
          DATE_TO: ${{ inputs.date_to }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
