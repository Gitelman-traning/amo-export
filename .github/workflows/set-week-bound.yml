name: Правка границы недели (AH15)

on:
  workflow_dispatch:
    inputs:
      spreadsheet_id:
        description: 'ID таблицы (пусто = текущая из переменной)'
        required: false
        default: ''
      dry_run:
        description: 'Только показать текущую формулу, без записи'
        required: false
        default: 'true'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python set_week_bound.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ inputs.spreadsheet_id || vars.SPREADSHEET_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
