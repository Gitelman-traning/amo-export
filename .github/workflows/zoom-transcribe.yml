name: Транскрибация зумов

on:
  # Запуск приходит извне (cron-job.org → GitHub API), плюс ручной из UI.
  workflow_dispatch:
    inputs:
      limit:
        description: 'Лимит записей за прогон (пусто = 21). Для теста поставь 1-2.'
        required: false
        default: ''

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120      # скачивание mp4 + Deepgram по нескольким записям может быть долгим
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python zoom_transcribe.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          DEEPGRAM_TOKEN: ${{ secrets.DEEPGRAM_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_PER_RUN: ${{ inputs.limit }}
