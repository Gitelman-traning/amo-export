name: BMI.io → Google Sheets (бюджет и расходы)

on:
  # Запускается СРАЗУ ПОСЛЕ ежедневной выгрузки звонков OnlinePBX (та крутится в 01:15 МСК),
  # так BMI обновляется каждый день вместе со звонками. Плюс ручной запуск из UI.
  workflow_run:
    workflows: ["OnlinePBX → Google Sheets (звонки)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date_from:
        description: "Начало периода YYYY-MM-DD (необязательно)"
        required: false
      date_to:
        description: "Конец периода YYYY-MM-DD (необязательно)"
        required: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # По цепочке — только если выгрузка звонков прошла успешно. Вручную — всегда.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python bmi_export.py
        env:
          BMI_API_KEY: ${{ secrets.BMI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
          BMI_MONTHS_BACK: ${{ vars.BMI_MONTHS_BACK }}
          BMI_DATE_FROM: ${{ inputs.date_from }}
          BMI_DATE_TO: ${{ inputs.date_to }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
