name: Публикация отчётов в Telegram

on:
  # Запускается СРАЗУ ПОСЛЕ успешного завершения выгрузки amoCRM
  workflow_run:
    workflows: ["amoCRM → Google Sheets (выгрузка авто)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только проверка, без реальной отправки (true/false)'
        required: false
        default: 'false'
      spreadsheet_id:
        description: 'ID таблицы для разовой публикации (пусто = текущая из переменной)'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # При запуске по цепочке — только если выгрузка amoCRM прошла успешно.
    # При ручном запуске (workflow_dispatch) — всегда.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tg_report.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SPREADSHEET_ID: ${{ inputs.spreadsheet_id || vars.SPREADSHEET_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          # при ручном запуске пауза на пересчёт не нужна (данные уже устоялись)
          REPORT_START_DELAY: ${{ github.event_name == 'workflow_dispatch' && '0' || '240' }}
