name: amoCRM → Google Sheets (выгрузка авто)

on:
  # Запуск приходит извне (cron-job.org → GitHub API), плюс ручной из UI.
  # Своё расписание GitHub отключено намеренно — его cron на этом репо был ненадёжен.
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Запустить выгрузку
        run: python amo_export.py
        env:
          AMO_TOKEN: ${{ secrets.AMO_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}

      # Наполняем import_clients значениями из «Клиенты 2025» вместо IMPORTRANGE,
      # чтобы после копирования таблицы блок оплат не обнулялся (не требовал ручного approve).
      - name: Обновить import_clients (без IMPORTRANGE)
        run: python sync_import_clients.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
