name: Сторож (добивает пропущенные ночные запуски)

on:
  schedule:
    # 23:30 UTC = 02:30 МСК — позже ночного окна (01:10–01:42 МСК) и в другом часу,
    # чтобы не попасть под ту же нагрузку планировщика GitHub.
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  actions: write      # нужно, чтобы запускать другие workflow
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Проверить ночные запуски и добить пропущенные
        shell: bash
        run: |
          set +e          # GitHub запускает bash с -e; выключаем, чтобы не обрывалось на gh-командах
          NOW=$(date -u +%s)
          THRESH=14400    # 4 часа: если запусков за это время не было — считаем пропущенным
          MSG="🛡 Сторож ночных запусков ($(date -u +%H:%M) UTC)"

          last_run_age () {   # echo: возраст последнего запуска workflow $1 в секундах (или большое число)
            local last ts
            last=$(gh run list --workflow="$1" --limit 1 --json createdAt --jq '.[0].createdAt // empty' 2>/dev/null)
            [ -z "$last" ] && { echo 999999; return; }
            ts=$(date -u -d "$last" +%s 2>/dev/null)
            [ -z "$ts" ] && { echo 999999; return; }
            echo $(( NOW - ts ))
          }

          ensure () {   # $1=файл workflow, $2=имя; возвращает 0 если пришлось запускать
            local age
            age=$(last_run_age "$1")
            if [ "$age" -gt "$THRESH" ]; then
              if gh workflow run "$1" >/dev/null 2>&1; then
                MSG="$MSG"$'\n'"⚠️ $2 — ночью не было, запустил"
              else
                MSG="$MSG"$'\n'"❌ $2 — не было, и запуск не удался"
              fi
              return 0
            fi
            MSG="$MSG"$'\n'"✅ $2 — отработал"
            return 1
          }

          ensure amo-export.yml "Выгрузка amoCRM"; AMO_DISP=$?
          ensure pbx-export.yml "Звонки OnlinePBX"
          ensure second-line.yml "2-я линия (контакты+сделки)"

          # Отчёты в ТГ зависят от выгрузки amoCRM.
          if [ "$AMO_DISP" -eq 0 ]; then
            sleep 20
            RID=$(gh run list --workflow=amo-export.yml --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null)
            gh run watch "$RID" --exit-status >/dev/null 2>&1
            gh workflow run tg-report.yml >/dev/null 2>&1 \
              && MSG="$MSG"$'\n'"↳ Отчёты в ТГ — запустил после выгрузки"
          else
            AGE=$(last_run_age tg-report.yml)
            if [ "$AGE" -gt "$THRESH" ]; then
              gh workflow run tg-report.yml >/dev/null 2>&1 \
                && MSG="$MSG"$'\n'"⚠️ Отчёты в ТГ — не было, запустил"
            else
              MSG="$MSG"$'\n'"✅ Отчёты в ТГ — отработали"
            fi
          fi

          echo "$MSG"
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=${MSG}" \
              --data "disable_web_page_preview=true" >/dev/null
          fi
