name: Разведка автозакрытия (read-only)

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python stale_probe.py
        env:
          AMO_TOKEN: ${{ secrets.AMO_TOKEN }}
