name: amoCRM 2-я линия (контакты + сделки)

on:
  schedule:
    # 22:20 UTC = 01:20 МСК, ежедневно
    - cron: '20 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только проверка, без записи в таблицу (true/false)'
        required: false
        default: 'false'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python second_line.py
        env:
          AMO_TOKEN: ${{ secrets.AMO_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
