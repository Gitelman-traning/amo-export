name: Активность по базе (реанимация / повторные диагностики)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Только проверка, без записи в таблицу (true/false)'
        required: false
        default: 'false'
      spreadsheet_id:
        description: 'ID таблицы. Пусто = текущая из переменной SPREADSHEET_ID'
        required: false
        default: ''
      sheet_gid:
        description: 'gid листа. Пусто = 1018816900 («выгрузка работа с базой клиентов»)'
        required: false
        default: ''
      date_from:
        description: 'Начало периода ДД.ММ.ГГГГ. Пусто = 1-е число текущего месяца'
        required: false
        default: ''
      date_to:
        description: 'Конец периода ДД.ММ.ГГГГ. Пусто = вчера'
        required: false
        default: ''

  # Ночью — следом за выгрузкой событий, чтобы не заводить отдельную задачу в cron-job.org.
  workflow_run:
    workflows: ["События amoCRM"]
    types: [completed]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python base_activity.py
        env:
          AMO_TOKEN: ${{ secrets.AMO_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPREADSHEET_ID: ${{ inputs.spreadsheet_id || vars.SPREADSHEET_ID }}
          SHEET_GID: ${{ inputs.sheet_gid }}
          DRY_RUN: ${{ inputs.dry_run }}
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
