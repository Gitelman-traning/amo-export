name: Баланс телефонии BMI

# Сторож баланса (см. bmi_balance.py): пишет в Telegram, если денег осталось
# меньше чем на 3 дня. Ночью он же идёт шагом в bmi-export.yml, здесь — днём.
on:
  schedule:
    # 09:00 и 17:00 МСК (GitHub может запустить с опозданием до часа-двух)
    - cron: '0 6,14 * * *'
  workflow_dispatch:
    inputs:
      report:
        description: 'Прислать сводку, даже если баланс в порядке (true/false)'
        required: false
        default: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python bmi_balance.py
        env:
          BMI_API_KEY: ${{ secrets.BMI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BMI_BALANCE_REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.report || 'false' }}
